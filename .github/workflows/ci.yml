name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,db,dev]"

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipagem
        run: mypy shared services

      - name: Testes
        run: pytest -q

  # Os testes do gate são a linha de defesa que impede varredura fora de escopo.
  # Se este job falhar, nada deve ser mesclado — nem que o resto esteja verde.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Testes de autorização e escopo
        run: |
          pytest -q \
            tests/test_targets.py \
            tests/test_scope_matching.py \
            tests/test_authorization_gate.py \
            tests/test_scope_guard.py \
            tests/test_audit_chain.py \
            tests/test_integracao_backoffice_gate.py
